<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Color Palette Explorer</title>
  <meta name="description" content="Explore, search and copy 20 handpicked colors.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='12' cy='12' r='9' fill='%23FF6F61'/%3E%3Ccircle cx='21' cy='12' r='9' fill='%233F37C9' fill-opacity='.8'/%3E%3Ccircle cx='16' cy='21' r='9' fill='%23F4C430' fill-opacity='.8'/%3E%3C/svg%3E">
  <script>
    // Runs before first paint so a saved dark theme never flashes light.
    (function () {
      var theme = null;
      try { theme = localStorage.getItem('theme'); } catch (e) {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Dark mode" aria-pressed="false">
    <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
    <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.700 6.300l1.4-1.4"/></svg>
  </button>

  <header class="hero">
    <h1>Color Palette Explorer</h1>
    <p>Twenty handpicked colors. Click any card to copy its HEX and paint the page.</p>
    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.800-3.800"/></svg>
      <input id="search" type="search" placeholder="Search by name or hex code" aria-label="Search colors by name or hex code" autocomplete="off" spellcheck="false">
    </div>
  </header>

  <main class="content">
    <section class="recent" aria-labelledby="recent-title">
      <h2 id="recent-title">Recently Viewed</h2>
      <div id="recent-list" class="recent-list"></div>
    </section>

    <section aria-labelledby="palette-title">
      <div class="palette-header">
        <h2 id="palette-title">The Palette</h2>
        <p id="result-count" class="result-count" role="status"></p>
      </div>
      <div id="grid" class="grid"></div>
      <p id="no-results" class="no-results" hidden>No colors match your search.</p>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
